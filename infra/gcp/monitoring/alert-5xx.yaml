displayName: "noticatch-dashboard: 5xx 오류 증가"
combiner: OR
conditions:
  - displayName: "5xx 응답이 5분에 5건 넘음"
    conditionThreshold:
      filter: 'metric.type="run.googleapis.com/request_count" AND resource.type="cloud_run_revision" AND resource.label.service_name="__SERVICE__" AND metric.label.response_code_class="5xx"'
      aggregations:
        - alignmentPeriod: 300s
          perSeriesAligner: ALIGN_DELTA
          crossSeriesReducer: REDUCE_SUM
      comparison: COMPARISON_GT
      thresholdValue: 5
      duration: 0s
      trigger:
        count: 1
documentation:
  content: "서비스가 5xx 오류를 돌려주고 있습니다. 최근 배포 이후라면 이전 리비전으로 되돌리세요."
  mimeType: text/markdown
notificationChannels: ["__CHANNEL__"]
