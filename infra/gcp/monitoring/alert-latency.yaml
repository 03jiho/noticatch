displayName: "noticatch-dashboard: 응답 지연"
combiner: OR
conditions:
  - displayName: "p95 응답시간이 5분 동안 1초 넘음"
    conditionThreshold:
      filter: 'metric.type="run.googleapis.com/request_latencies" AND resource.type="cloud_run_revision" AND resource.label.service_name="__SERVICE__"'
      aggregations:
        - alignmentPeriod: 300s
          perSeriesAligner: ALIGN_PERCENTILE_95
          crossSeriesReducer: REDUCE_MAX
      comparison: COMPARISON_GT
      thresholdValue: 1000
      duration: 300s
      trigger:
        count: 1
documentation:
  content: "p95 응답시간이 1초를 넘었습니다. 인스턴스 수 제한(max-instances)과 콜드 스타트를 확인하세요."
  mimeType: text/markdown
notificationChannels: ["__CHANNEL__"]
