# CI/CD 파이프라인: Lint → Test(매트릭스) → Build → Deploy
#
#   lint ──▶ test (3 OS × 3 Python = 9개 조합) ──▶ build ──▶ deploy
#                      │                             │          ▲
#                      └ junit 결과 아티팩트 업로드    └ dist 아티팩트 업로드 ─┘ 다운로드
#
# - PR: lint, test, build 까지 실행 (deploy 는 건너뜀)
# - main 에 push: deploy 까지 실행 (아티팩트를 내려받아 무결성 검증 후 스모크 테스트)
# - v* 태그 push: deploy 에서 GitHub Release 를 만들고 번들을 첨부
#
# Secrets
# - secrets.GITHUB_TOKEN : Actions 가 자동으로 만들어 주는 토큰. 릴리스 생성에만 쓴다.
# - secrets.NOTIFY_WEBHOOK_URL : (선택) 배포 알림을 받을 웹훅 주소. 없으면 알림만 건너뛴다.
#   저장소 Settings → Secrets and variables → Actions 에서 등록한다. 값은 로그에 마스킹된다.
#
# 참고: 지표 계산이 "배포"로 보는 워크플로우는 deploy-pages.yml 이다. 이 파일의 deploy 작업은
#       DORA 배포 지표에 영향을 주지 않는다.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# 같은 브랜치에서 새 커밋이 오면 이전 PR 검사는 취소한다. main/태그는 끝까지 실행한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 기본 권한은 읽기 전용. 필요한 작업만 아래에서 올린다.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check . --output-format=github

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # 한 조합이 실패해도 나머지 결과를 끝까지 보기 위해 fail-fast 를 끈다.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest --junitxml=test-results/junit.xml
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results/junit.xml
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build bundle
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build zip + manifest
        env:
          # 브랜치·태그 이름은 셸에 직접 끼워 넣지 않고 환경변수로 받는다.
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then VERSION="$REF_NAME"; else VERSION="0.0.0-${GITHUB_SHA::7}"; fi
          python scripts/build_dist.py build --version "$VERSION" --out dist
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy
    needs: build
    # PR 과 수동 실행에서는 배포하지 않는다. main 또는 v* 태그 push 일 때만 실행한다.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # 태그 push 일 때 릴리스를 만들기 위해서만 필요하다.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Verify artifact integrity
        run: python scripts/build_dist.py verify --dist dist
      - name: Smoke test the unpacked bundle
        run: |
          mkdir release-check
          python -m zipfile -e dist/noticatch-*.zip release-check
          test -f release-check/dashboard/index.html
          python -m compileall -q release-check/scripts
          echo "번들 풀기와 컴파일 확인 완료"
      - name: Job summary
        run: |
          {
            echo "### 배포 번들"
            echo ""
            echo "- 커밋: \`${GITHUB_SHA::7}\`"
            echo "- 파일: $(ls dist | tr '\n' ' ')"
            echo ""
            echo '```json'
            python -c "import json; d = json.load(open('dist/manifest.json', encoding='utf-8')); print(json.dumps({k: d[k] for k in ('version', 'commit', 'bundle', 'bundle_sha256', 'file_count')}, indent=2))"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create GitHub Release (tags only)
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # 사람이 먼저 Release 를 만들어 둔 경우에도 실패하지 않도록, 있으면 번들만 올린다.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/manifest.json --clobber
          else
            gh release create "$TAG" dist/*.zip dist/manifest.json --title "$TAG" --generate-notes --verify-tag
          fi
      - name: Notify (optional)
        # 알림 실패가 배포 결과를 바꾸지 않도록 한다. 시크릿이 없으면 건너뛴다.
        continue-on-error: true
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$NOTIFY_WEBHOOK_URL" ]; then
            echo "NOTIFY_WEBHOOK_URL 이 설정되지 않아 알림을 건너뜁니다."
            exit 0
          fi
          python - <<'PY'
          import json, os, urllib.request
          text = f"NotiCatch 배포 완료: {os.environ['REF_NAME']} ({os.environ['GITHUB_SHA'][:7]})"
          req = urllib.request.Request(
              os.environ["NOTIFY_WEBHOOK_URL"],
              data=json.dumps({"text": text}).encode(),
              headers={"Content-Type": "application/json"},
          )
          urllib.request.urlopen(req, timeout=15).close()
          print("알림을 보냈습니다.")
          PY
