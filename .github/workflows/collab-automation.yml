# 비동기 협업 자동화 (초안)
#  1) auto-reply     : 새 이슈/토론에 1차 응답 안내 댓글
#  2) sla-check      : 1차 응답 SLA를 넘긴 이슈에 라벨과 댓글, 응답 없는 토론은 요약에 표시
#  3) weekly-summary : 지난 7일 활동을 요약한 이슈를 매주 월요일에 생성
#
# 초안이라 SLA는 "영업일"이 아니라 경과 시간(SLA_HOURS) 기준이다.
# 이슈/토론 제목·본문은 스크립트에 문자열로 끼워 넣지 않고 context 객체로만 읽는다.
name: Collab Automation

on:
  issues:
    types: [opened]
  discussion:
    types: [created]
  schedule:
    - cron: "0 0 * * *"        # 매일 09:00 KST: SLA 점검
    - cron: "0 0 * * 1"        # 매주 월요일 09:00 KST: 주간 요약
  workflow_dispatch:           # 수동 실행: SLA 점검 + 주간 요약

permissions: {}

env:
  SLA_HOURS: "48"              # 1차 응답 목표 시간

jobs:
  auto-reply:
    if: github.event_name == 'issues' || github.event_name == 'discussion'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      discussions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const isDiscussion = context.eventName === 'discussion';
            const item = isDiscussion ? context.payload.discussion : context.payload.issue;
            if (!item || !item.user || item.user.type === 'Bot') return core.info('봇이 작성함, 건너뜀');
            if (item.author_association === 'OWNER') return core.info('저장소 소유자가 작성함, 건너뜀');

            const kind = isDiscussion ? '토론' : '이슈';
            const body = [
              `${kind}를 남겨 주셔서 감사합니다.`,
              '',
              `- **1차 응답 목표:** ${process.env.SLA_HOURS}시간 이내`,
              '- 재현 방법, 기대한 결과, 실제 결과를 적어 주시면 더 빨리 확인할 수 있습니다.',
              '- 서비스 장애처럼 급한 문제는 `incident` 라벨을 요청해 주세요.',
              '- 기여 방법은 [Wiki](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/wiki)를 참고해 주세요.',
              '',
              '_이 댓글은 자동으로 작성되었습니다._',
            ].join('\n');

            if (isDiscussion) {
              await github.graphql(
                `mutation($id: ID!, $body: String!) {
                   addDiscussionComment(input: {discussionId: $id, body: $body}) { comment { id } }
                 }`,
                { id: item.node_id, body },
              );
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: item.number, body });
            }

  sla-check:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * *'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      discussions: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const slaMs = Number(process.env.SLA_HOURS) * 3600 * 1000;
            const now = Date.now();
            const label = 'sla: breached';

            try {
              await github.rest.issues.createLabel({
                ...context.repo, name: label, color: 'b60205',
                description: '1차 응답 SLA를 넘긴 이슈',
              });
            } catch (e) { if (e.status !== 422) throw e; }   // 이미 있으면 무시

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100,
            });
            // auto-reply 의 안내 댓글(봇)과 작성자 본인의 댓글은 "응답"으로 치지 않는다.
            // 그렇지 않으면 안내 댓글 때문에 SLA 점검이 영원히 건너뛰게 된다.
            const hasHumanReply = async i => {
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo, issue_number: i.number, per_page: 100,
              });
              return comments.some(c => c.user && c.user.type !== 'Bot' && c.user.login !== i.user.login);
            };

            const breached = [];
            for (const i of issues) {
              if (i.pull_request) continue;                         // PR 제외
              if (i.user.type === 'Bot' || i.author_association === 'OWNER') continue;
              if (i.labels.some(l => l.name === label)) continue;   // 이미 표시함
              if (now - Date.parse(i.created_at) < slaMs) continue;
              if (i.comments > 0 && await hasHumanReply(i)) continue;   // 사람이 이미 응답함
              await github.rest.issues.addLabels({ ...context.repo, issue_number: i.number, labels: [label] });
              await github.rest.issues.createComment({
                ...context.repo, issue_number: i.number,
                body: `1차 응답 목표(${process.env.SLA_HOURS}시간)를 넘겼습니다. 담당자는 확인해 주세요.`,
              });
              breached.push(i);
            }

            let staleDiscussions = [];
            let discussionNote = '';
            try {
              const res = await github.graphql(
                `query($owner: String!, $name: String!) {
                   repository(owner: $owner, name: $name) {
                     discussions(first: 50, orderBy: {field: CREATED_AT, direction: DESC}) {
                       nodes {
                         number title url createdAt author { login }
                         comments(first: 20) { totalCount nodes { author { __typename login } } }
                       }
                     }
                   }
                 }`,
                { owner: context.repo.owner, name: context.repo.repo },
              );
              // 댓글이 20개를 넘으면 사람이 답했을 가능성이 높다고 보고 응답한 것으로 센다.
              const answered = d => d.comments.totalCount > d.comments.nodes.length ||
                d.comments.nodes.some(c => c.author && c.author.__typename !== 'Bot' && c.author.login !== d.author.login);
              staleDiscussions = res.repository.discussions.nodes.filter(d =>
                (now - Date.parse(d.createdAt)) >= slaMs && !answered(d) &&
                d.author && d.author.login !== context.repo.owner);
            } catch (e) { discussionNote = `토론 조회 실패(Discussions가 꺼져 있을 수 있음): ${e.message}`; }

            core.summary.addHeading('SLA 점검 결과');
            core.summary.addRaw(`\n- 이슈 SLA 초과: **${breached.length}건**\n- 응답 없는 토론: **${staleDiscussions.length}건**\n`);
            if (breached.length) core.summary.addList(breached.map(i => `#${i.number} ${i.title}`));
            if (staleDiscussions.length) core.summary.addList(staleDiscussions.map(d => `[#${d.number}](${d.url}) ${d.title}`));
            if (discussionNote) core.summary.addRaw(`\n${discussionNote}\n`);
            await core.summary.write();

  weekly-summary:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * 1'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read   # PR 건수 검색에 필요하다. 없으면 PR이 검색 결과에서 빠져 0건으로 나온다.
      discussions: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const sinceDate = new Date(Date.now() - 7 * 86400000);
            const since = sinceDate.toISOString().slice(0, 10);

            // ISO 주차 (목요일 기준)
            const t = new Date(Date.UTC(sinceDate.getUTCFullYear(), sinceDate.getUTCMonth(), sinceDate.getUTCDate()));
            t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
            const week = Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 86400000 + 1) / 7);
            const title = `주간 요약 ${t.getUTCFullYear()}-W${String(week).padStart(2, '0')}`;

            // 검색 API는 짧은 시간에 연달아 부르면 보조 속도 제한(403)에 걸린다. 호출 사이에 간격을 둔다.
            const sleep = ms => new Promise(r => setTimeout(r, ms));
            const delay = Number(process.env.SEARCH_DELAY_MS ?? 2000);

            // 간격을 둬도 보조 속도 제한(403)이 날 수 있다. github-script 는 403 을 재시도하지 않으므로
            // 응답의 retry-after(없으면 60초)만큼 기다렸다가 최대 4번 시도한다. 월요일에는 SLA 점검과
            // 주간 요약이 같은 시각에 함께 돌아서 같은 토큰으로 요청이 몰린다.
            const retryWait = Number(process.env.RETRY_WAIT_MS ?? 60000);
            const search = async q => {
              for (let attempt = 1; ; attempt++) {
                try {
                  return await github.rest.search.issuesAndPullRequests({ q, per_page: 1 });
                } catch (e) {
                  const limited = (e.status === 403 || e.status === 429) && /rate limit/i.test(e.message || '');
                  if (!limited || attempt >= 4) throw e;
                  const after = Number(e.response?.headers?.['retry-after']);
                  const wait = after > 0 ? after * 1000 : retryWait;
                  core.info(`속도 제한: ${Math.round(wait / 1000)}초 뒤 재시도 (${attempt}/3)`);
                  await sleep(wait);
                }
              }
            };

            const dup = await search(`repo:${repo} is:issue in:title "${title}"`);
            const existing = dup.data.items[0];
            // 같은 제목을 사람이 만든 이슈가 있으면 건드리지 않는다.
            if (existing && existing.user.type !== 'Bot') return core.info(`같은 제목의 사용자 이슈가 있어 건너뜀: ${title}`);

            // 요약 이슈 자신(봇이 만든 이슈)은 집계에서 뺀다.
            const count = async q => {
              await sleep(delay);
              return (await search(`repo:${repo} ${q}`)).data.total_count;
            };

            const opened = await count(`is:issue created:>=${since} -author:app/github-actions`);
            const closed = await count(`is:issue closed:>=${since} -author:app/github-actions`);
            const prOpened = await count(`is:pr created:>=${since}`);
            const prMerged = await count(`is:pr is:merged merged:>=${since}`);
            const openNow = await count('is:issue is:open -author:app/github-actions');
            const breached = await count('is:issue is:open label:"sla: breached"');

            let discussionLine = '비활성 또는 조회 실패';
            try {
              const res = await github.graphql(
                `query($owner: String!, $name: String!) {
                   repository(owner: $owner, name: $name) {
                     discussions(first: 100, orderBy: {field: CREATED_AT, direction: DESC}) { nodes { createdAt } }
                   }
                 }`,
                { owner: context.repo.owner, name: context.repo.repo },
              );
              discussionLine = `${res.repository.discussions.nodes.filter(d => d.createdAt.slice(0, 10) >= since).length}건`;
            } catch (e) { core.info(`토론 조회 실패: ${e.message}`); }

            const body = [
              `기간: ${since} 이후 7일 (자동 생성)`,
              '',
              '| 항목 | 값 |',
              '|---|---|',
              `| 새 이슈 | ${opened} |`,
              `| 닫힌 이슈 | ${closed} |`,
              `| 열린 PR | ${prOpened} |`,
              `| 머지된 PR | ${prMerged} |`,
              `| 새 토론 | ${discussionLine} |`,
              `| 현재 열린 이슈 | ${openNow} |`,
              `| SLA 초과로 표시된 이슈 | ${breached} |`,
              '',
              '지표 상세는 [대시보드](https://' + context.repo.owner + '.github.io/' + context.repo.repo + '/)와 `reports/` 폴더를 참고하세요.',
            ].join('\n');

            if (existing) {
              // 같은 주를 다시 실행하면(수동 실행 등) 새 이슈를 만들지 않고 숫자를 갱신한다.
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body });
              return core.info(`갱신: ${existing.html_url}`);
            }
            const created = await github.rest.issues.create({
              ...context.repo, title, body, labels: ['type: chore'],
            });
            core.info(`생성: ${created.data.html_url}`);
