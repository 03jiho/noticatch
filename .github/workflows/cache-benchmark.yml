# 캐시 효과 측정: 같은 의존성 설치를 "캐시 없음"과 "캐시 사용"으로 나눠 걸린 시간을 비교한다.
#
# 한 작업(job)이 샘플 하나다. OS 3종 × 의존성 2묶음(dev, scripts) × 반복 3회 = 18개 작업.
#   1) prime   : 캐시를 쓰는 pip 로 한 번 설치해 pip 캐시 폴더를 채운다            (측정 안 함)
#   2) save    : pip 캐시 폴더를 actions/cache 로 저장한다                            (측정 안 함)
#   3) purge   : 로컬 pip 캐시를 비운다
#   4) cold    : pip install --no-cache-dir  ← "캐시 없음"                            (측정)
#   5) restore : actions/cache/restore 로 캐시를 복원한다                             (측정)
#   6) warm    : 복원된 캐시로 pip install   ← "pip 캐시 사용" = 복원 + 이 설치       (측정)
# 이어서 두 번째 전략인 "설치가 끝난 가상환경 자체를 캐시"도 같은 작업에서 측정한다.
#   7) venv    : 가상환경을 만들어 설치하고 actions/cache 로 저장한 뒤 지운다          (측정 안 함)
#   8) restore : 가상환경 캐시를 복원한다 ← "가상환경 캐시 사용"(설치를 건너뜀)       (측정)
# 단계별 시간은 Actions API 의 started_at/completed_at 이고, report 작업이 scripts/ci_timing.py 로 집계한다.
#
# 실행 시점: 수동 실행, 그리고 이 파일·requirements-scripts.txt·Composite Action 이 바뀐 PR.
name: Cache Benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/cache-benchmark.yml
      - .github/actions/setup-python-env/**
      - requirements-scripts.txt
      - scripts/ci_timing.py

permissions:
  contents: read

concurrency:
  group: cache-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    # 따옴표가 필요하다. 따옴표가 없으면 ` #` 부터 YAML 주석으로 읽혀 이름이 잘린다.
    name: "Bench (${{ matrix.os }}, ${{ matrix.case }}, #${{ matrix.n }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        case: [dev, scripts]      # requirements-dev.txt / requirements-scripts.txt
        n: [1, 2, 3]              # 반복 측정(중앙값을 쓴다)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find pip cache dir
        id: pip
        run: echo "dir=$(python -m pip cache dir)" >> "$GITHUB_OUTPUT"
      - name: Prime pip cache
        run: python -m pip install --target prime_site -r requirements-${{ matrix.case }}.txt
      - name: Save pip cache
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.pip.outputs.dir }}
          key: bench-${{ runner.os }}-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.n }}
      - name: Purge local pip cache
        run: python -m pip cache purge
      - name: Install without cache
        run: python -m pip install --no-cache-dir --target cold_site -r requirements-${{ matrix.case }}.txt
      - name: Restore pip cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pip.outputs.dir }}
          key: bench-${{ runner.os }}-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.n }}
          fail-on-cache-miss: true
      - name: Install with restored cache
        run: python -m pip install --target warm_site -r requirements-${{ matrix.case }}.txt
      - name: Build venv
        run: |
          python -m venv venv_site
          if [ -d venv_site/Scripts ]; then BIN=venv_site/Scripts; else BIN=venv_site/bin; fi
          "$BIN/python" -m pip install -r requirements-${{ matrix.case }}.txt
      - name: Save venv cache
        uses: actions/cache/save@v4
        with:
          path: venv_site
          key: benchv-${{ runner.os }}-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.n }}
      - name: Remove venv
        run: rm -rf venv_site
      - name: Restore venv cache
        uses: actions/cache/restore@v4
        with:
          path: venv_site
          key: benchv-${{ runner.os }}-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.n }}
          fail-on-cache-miss: true
      - name: Check restored venv
        run: |
          if [ -d venv_site/Scripts ]; then BIN=venv_site/Scripts; else BIN=venv_site/bin; fi
          "$BIN/python" -c "import sys; print(sys.prefix)"
          "$BIN/python" -m pip --version
          "$BIN/python" -m pip check

  report:
    name: Report
    needs: bench
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Summarize timings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci_timing.py bench --run "${{ github.run_id }}" --markdown "$GITHUB_STEP_SUMMARY" --json bench.json
      - uses: actions/upload-artifact@v4
        with:
          name: cache-benchmark
          path: bench.json
          retention-days: 30

  # 운영 스크립트용 Composite Action 경로(requirements-scripts.txt)가 실제로 동작하는지 확인한다.
  # sprint-metrics / bootstrap-backlog 워크플로우가 같은 입력으로 이 Composite Action 을 쓴다.
  verify-composite:
    name: Verify composite action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          requirements: requirements-scripts.txt
      - run: python -c "import matplotlib, yaml; print('matplotlib', matplotlib.__version__, '/ pyyaml', yaml.__version__)"
