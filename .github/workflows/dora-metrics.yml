# DORA 4대 지표를 수집해서 JSON 아티팩트, 주간 보고서, README 표로 남긴다.
name: DORA Metrics

on:
  schedule:
    - cron: "0 0 * * 1"        # 매주 월요일 09:00 KST
  workflow_run:
    workflows: [Deploy]          # 배포가 끝날 때마다 갱신
    types: [completed]
  issues:
    types: [closed]              # incident 이슈가 닫히면 MTTR 갱신
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: read

concurrency:
  group: dora-metrics
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'incident')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect DORA metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_WORKFLOW: deploy-pages.yml
          WINDOW_DAYS: "30"
          WEEKS: "8"
        run: python scripts/dora_metrics.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: dora-metrics-${{ github.run_number }}
          path: |
            metrics/dora-latest.json
            reports/LATEST.md
          retention-days: 90

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics reports README.md
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore(dora): 지표 자동 갱신 [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
