# PR 프리뷰 1단계: PR 에서 대시보드 변경이 프리뷰로 올려도 안전한지 검사한다. (이 워크플로우는 아무것도 배포하지 않는다)
#
# 배포는 2단계(pages-preview-deploy.yml)가 한다. 이렇게 둘로 나누는 이유:
#  - GitHub Pages 의 github-pages 환경은 기본 브랜치에서 시작한 배포만 받는다. PR 브랜치에서는 배포할 수 없다.
#  - 2단계는 이 워크플로우가 끝나면 workflow_run 으로 시작하고, 기본 브랜치(main)의 워크플로우 파일로 실행된다.
#    PR 의 코드는 실행하지 않고 대시보드 정적 파일만 복사하므로 포크 PR 이 비밀값에 닿을 일이 없다.
name: Pages Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
    paths:
      - "dashboard/**"
      - "scripts/build_pages_site.py"
      - ".github/workflows/pages-preview*.yml"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read

concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate dashboard for preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Dashboard files exist and are valid
        run: |
          test -f dashboard/index.html
          python3 -c "import json; json.load(open('dashboard/sample-data.json', encoding='utf-8'))"
      # 프리뷰는 /pr-preview/pr-N/ 아래에서 서비스된다. '/' 로 시작하는 링크는 거기서 깨진다.
      - name: No root-absolute links
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from pathlib import Path
          from build_pages_site import check_relative_links
          bad = check_relative_links(Path("dashboard/index.html").read_text(encoding="utf-8"))
          if bad:
              print(f"::error::프리뷰 하위 경로에서 깨질 절대 경로 링크: {bad}")
              sys.exit(1)
          print("절대 경로 링크 없음")
          PY
