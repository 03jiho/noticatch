# PR 프리뷰 2단계: "main 대시보드 + 열려 있는 PR 프리뷰 전부"를 GitHub Pages 에 올리고, PR 에 프리뷰 주소를 댓글로 남긴다.
#
# - 프리뷰 주소: https://03jiho.github.io/noticatch/pr-preview/pr-<번호>/
# - PR 이 닫히면(또는 초안으로 바뀌면) 같은 배포에서 그 프리뷰가 빠지고, 댓글이 "내렸습니다"로 바뀐다.
# - main 에 합쳐질 때는 deploy-pages.yml 이 같은 스크립트로 프리뷰를 유지한 채 올린다. (서로 지우지 않는다)
name: Pages Preview Deploy

on:
  workflow_run:
    workflows: ["Pages Preview"]
    types: [completed]

permissions:
  contents: read

# 사이트 전체를 바꾸는 배포라서 동시에 둘이 돌면 안 된다. main 배포(deploy-pages.yml)와 같은 그룹을 쓴다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy previews
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
      pull-requests: write   # 프리뷰 주소 댓글
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}pr-preview/
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - uses: actions/checkout@v4   # 기본 브랜치(main). PR 코드는 build_pages_site.py 가 git 에서 dashboard/ 만 꺼낸다.

      - name: Build site (main + open PR previews)
        run: python3 scripts/build_pages_site.py --repo "$GITHUB_REPOSITORY" --out _site --previews --manifest manifest.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # Pages 배포는 가끔 "No artifacts named github-pages"(업로드가 아직 안 보임)나 "Deployment failed, try again later"
      # 로 일시적으로 실패한다. 같은 아티팩트로 최대 3번까지 다시 시도하고, 3번 모두 실패하면 작업을 실패시킨다.
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry (1)
        if: ${{ steps.deploy1.outcome == 'failure' }}
        run: sleep 20
      - id: deploy2
        if: ${{ steps.deploy1.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry (2)
        if: ${{ steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' }}
        run: sleep 40
      - id: deploy3
        if: ${{ steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
      - id: deployment
        name: Resolve the deployed page URL
        env:
          URL1: ${{ steps.deploy1.outputs.page_url }}
          URL2: ${{ steps.deploy2.outputs.page_url }}
          URL3: ${{ steps.deploy3.outputs.page_url }}
        run: echo "page_url=${URL1:-${URL2:-$URL3}}" >> "$GITHUB_OUTPUT"

      # 올린 뒤 실제 주소로 열어 본다. (CDN 에 퍼지는 데 몇 초 걸릴 수 있어 재시도한다)
      - name: Verify the live preview URLs
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          fetch() {  # fetch <url> <찾을 문자열>
            for i in $(seq 1 18); do
              if curl -fsS "$1" | grep -q "$2"; then echo "OK  $1"; return 0; fi
              sleep 10
            done
            echo "::error::$1 에서 '$2' 를 확인하지 못했습니다."; return 1
          }
          fetch "$PAGE_URL" "NotiCatch"
          for n in $(jq -r '.[].number' manifest.json); do
            fetch "${PAGE_URL}pr-preview/pr-$n/" "PR #$n 프리뷰"
          done

      - name: Comment the preview URL on the pull request
        if: ${{ env.PR_NUMBER != '' }}
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          marker='<!-- pages-preview -->'
          sha=$(jq -r --argjson n "$PR_NUMBER" '.[] | select(.number == $n) | .sha[0:7]' manifest.json)
          state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.state')
          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n1)

          if [ -n "$sha" ]; then
            body="$marker
          ### 프리뷰 환경
          대시보드 변경을 미리 볼 수 있습니다: ${PAGE_URL}pr-preview/pr-${PR_NUMBER}/

          - 커밋: \`$sha\` (새 커밋을 올리면 자동으로 갱신됩니다)
          - 이 PR 이 닫히면 프리뷰도 함께 내려갑니다."
          elif [ -n "$comment_id" ]; then
            if [ "$state" = "closed" ]; then why="PR 이 닫혀서"; else why="초안이거나 대시보드 변경이 없어서"; fi
            body="$marker
          ### 프리뷰 환경
          $why 프리뷰를 내렸습니다."
          else
            echo "프리뷰 대상이 아니고 기존 댓글도 없어 댓글을 남기지 않습니다."; exit 0
          fi

          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" > /dev/null
            echo "댓글을 갱신했습니다."
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
            echo "댓글을 남겼습니다."
          fi
