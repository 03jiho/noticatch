# 대시보드(dashboard/)를 GitHub Pages로 배포한다.
# DORA 지표에서 "배포"의 기준이 되는 워크플로우다.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "metrics/**"
      - "reports/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read   # 열려 있는 PR 프리뷰를 목록으로 읽는다.
  actions: read         # 업로드한 아티팩트가 보이는지 확인한다.

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check dashboard files
        run: test -f dashboard/index.html

      # main 의 대시보드에 열려 있는 PR 프리뷰를 더해서 올린다. (프리뷰를 지우지 않으려고 같은 스크립트를 쓴다)
      - name: Build site (main + open PR previews)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_pages_site.py --repo "$GITHUB_REPOSITORY" --out _site --previews

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # 업로드한 아티팩트가 목록 API 에 보이기까지 몇 초 걸리는 경우가 있어, 바로 배포하면
      # "No artifacts named github-pages" 로 실패한다. 보일 때까지 기다린 뒤 배포한다.
      - name: Wait until the Pages artifact is listed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 24); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$n" -gt 0 ]; then echo "아티팩트가 목록에 나타났습니다 (${i}번째 확인)."; exit 0; fi
            sleep 5
          done
          echo "::warning::아티팩트가 2분 안에 목록에 나타나지 않았습니다. 그대로 배포를 시도합니다."

      - id: deployment
        uses: actions/deploy-pages@v4

      # 올린 뒤 실제 주소가 열리는지 확인한다. (CDN 에 퍼지는 데 몇 초 걸릴 수 있어 재시도한다)
      - name: Verify the live site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in $(seq 1 18); do
            if curl -fsS "$PAGE_URL" | grep -q "NotiCatch" && curl -fsS "${PAGE_URL}sample-data.json" > /dev/null; then
              echo "OK  $PAGE_URL"; exit 0
            fi
            sleep 10
          done
          echo "::error::$PAGE_URL 이 열리지 않습니다."; exit 1
