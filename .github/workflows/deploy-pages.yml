# 대시보드(dashboard/)를 GitHub Pages로 배포한다.
# DORA 지표에서 "배포"의 기준이 되는 워크플로우다.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "metrics/**"
      - "reports/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read   # 열려 있는 PR 프리뷰를 목록으로 읽는다.

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check dashboard files
        run: test -f dashboard/index.html

      # main 의 대시보드에 열려 있는 PR 프리뷰를 더해서 올린다. (프리뷰를 지우지 않으려고 같은 스크립트를 쓴다)
      - name: Build site (main + open PR previews)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_pages_site.py --repo "$GITHUB_REPOSITORY" --out _site --previews

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Pages 배포는 가끔 "No artifacts named github-pages"(업로드가 아직 안 보임)나 "Deployment failed, try again later"
      # 로 일시적으로 실패한다. 같은 아티팩트로 최대 3번까지 다시 시도하고, 3번 모두 실패하면 작업을 실패시킨다.
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry (1)
        if: ${{ steps.deploy1.outcome == 'failure' }}
        run: sleep 20
      - id: deploy2
        if: ${{ steps.deploy1.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry (2)
        if: ${{ steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' }}
        run: sleep 40
      - id: deploy3
        if: ${{ steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
      - id: deployment
        name: Resolve the deployed page URL
        env:
          URL1: ${{ steps.deploy1.outputs.page_url }}
          URL2: ${{ steps.deploy2.outputs.page_url }}
          URL3: ${{ steps.deploy3.outputs.page_url }}
        run: echo "page_url=${URL1:-${URL2:-$URL3}}" >> "$GITHUB_OUTPUT"

      # 올린 뒤 실제 주소가 열리는지 확인한다. (CDN 에 퍼지는 데 몇 초 걸릴 수 있어 재시도한다)
      - name: Verify the live site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in $(seq 1 18); do
            if curl -fsS "$PAGE_URL" | grep -q "NotiCatch" && curl -fsS "${PAGE_URL}sample-data.json" > /dev/null; then
              echo "OK  $PAGE_URL"; exit 0
            fi
            sleep 10
          done
          echo "::error::$PAGE_URL 이 열리지 않습니다."; exit 1
