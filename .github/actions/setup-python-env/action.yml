# Composite Action: Python 설치 + pip 캐시 + 의존성 설치를 한 번에 처리한다.
# 여러 워크플로우에 복사되어 있던 setup-python / pip install 단계를 이 파일 하나로 모았다.
# 사용 전에 actions/checkout 이 먼저 실행되어야 한다(이 파일과 requirements 파일을 읽기 위해).
name: Setup Python environment
description: Python 설치, pip 캐시, 의존성 설치

inputs:
  python-version:
    description: 설치할 Python 버전
    default: "3.12"
  requirements:
    description: 설치할 requirements 파일. 여러 개면 줄바꿈으로 구분하고, 비우면 설치와 캐시를 건너뛴다.
    default: requirements-dev.txt
  cache:
    description: pip 캐시 사용 여부 ("true" 또는 "false")
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ (inputs.cache == 'true' && inputs.requirements != '') && 'pip' || '' }}
        cache-dependency-path: ${{ inputs.requirements }}
    - name: Install dependencies
      if: ${{ inputs.requirements != '' }}
      shell: bash
      env:
        REQUIREMENTS: ${{ inputs.requirements }}
      run: |
        args=()
        for f in $REQUIREMENTS; do args+=(-r "$f"); done
        python -m pip install "${args[@]}"
