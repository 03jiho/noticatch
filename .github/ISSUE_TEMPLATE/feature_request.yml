name: 기능 제안
description: 새 기능이나 개선 아이디어
title: "[Feature] "
labels: ["type: feature"]
body:
  - type: textarea
    id: story
    attributes:
      label: 사용자 스토리
      description: 누가, 무엇을, 왜 원하는지 한 문장으로 적어주세요.
      placeholder: 재학생으로서, 관심 키워드가 들어간 공지만 알림으로 받고 싶다. 매일 여러 사이트를 확인하지 않아도 되도록.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 지금 불편한 점
      description: 이 기능이 없어서 생기는 문제나 상황
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 이 조건을 모두 만족하면 Done으로 본다.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - 크롤러 (공지 수집)
        - 백엔드 API
        - 웹 화면
        - 알림 (이메일/푸시)
        - 배포·CI
        - 문서
  - type: textarea
    id: notes
    attributes:
      label: 참고 자료
      description: 비슷한 서비스, 디자인 시안, 관련 이슈 등
